[functions.send-alert-email]
enabled = true
verify_jwt = false
# No import_map: this function has no deno.json (it never had one —
# not a regression). Removed 2026-08-15 rather than pointing at a file
# that doesn't exist; the function imports everything it needs via
# full jsr:/npm: specifiers directly, so no import map was ever needed.
entrypoint = "./functions/send-alert-email/index.ts"

