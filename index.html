<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The previous fix here (referencing public/favicon.svg) turned out to
         be wrong: that file was never actually a senseUS mark at all — it's
         an unrelated purple-blue lightning-bolt graphic, confirmed by
         rendering it directly rather than trusting its filename. It's been
         deleted from public/ so nothing can pick it up again. This is the
         real fix: a proper multi-resolution favicon.ico (16x16 + 32x32,
         generated from the actual logo, from Aidan's assets/web/ folder) —
         browsers have long checked /favicon.ico at the site root by
         convention regardless of any <link> tag, which is almost certainly
         why the lightning bolt was surfacing in address-bar suggestions
         even before it was ever explicitly linked here. apple-touch-icon
         is the same real logo too, simplified the same way. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>senseUS — real humans. real opinions. real truth.</title>
    <meta name="description" content="senseUS is a verified human opinion platform. One person, one account, one voice." />

    <meta property="og:title" content="senseUS — real humans. real opinions. real truth." />
    <meta property="og:description" content="Join the conversation on senseUS — a verified human opinion platform." />
    <meta property="og:image" content="https://senseus.app/og-image.png" />
    <meta property="og:url" content="https://senseus.app" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="senseUS — real humans. real opinions. real truth." />
    <meta name="twitter:description" content="Join the conversation on senseUS — a verified human opinion platform." />
    <meta name="twitter:image" content="https://senseus.app/og-image.png" />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Rock+Salt&display=swap" rel="stylesheet">
  </head>
