<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon.svg is the actual purpose-built small mark (public/favicon.svg,
         48x46, single brand-color path) — it existed in the repo already but
         was never referenced here, so every browser fell back to whatever it
         could make of the full detailed logo PNG below (or, for surfaces like
         Chrome's address-bar suggestions that specifically look for a small
         dedicated icon, nothing usable at all — hence the generic icon
         showing up for the bare domain while already-visited pages, which
         Chrome caches a page-fetched icon for separately, still showed the
         real logo). SVG first (modern browsers, crisp at any size), PNG as
         the fallback for anything that doesn't support SVG favicons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/senseUS-logo.png" />
    <link rel="apple-touch-icon" href="/senseUS-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>senseUS — real humans. real opinions. real truth.</title>
    <meta name="description" content="senseUS is a verified human opinion platform. One person, one account, one voice." />

    <meta property="og:title" content="senseUS — real humans. real opinions. real truth." />
    <meta property="og:description" content="Join the conversation on senseUS — a verified human opinion platform." />
    <meta property="og:image" content="https://senseus.app/og-image.png" />
    <meta property="og:url" content="https://senseus.app" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="senseUS — real humans. real opinions. real truth." />
    <meta name="twitter:description" content="Join the conversation on senseUS — a verified human opinion platform." />
    <meta name="twitter:image" content="https://senseus.app/og-image.png" />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Rock+Salt&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
